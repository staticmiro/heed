# Configuration for Heed monitoring daemon

[server]
# Server name to include in alert notifications
name = "home-server"

[monitor]
# Frequency of running all checks
interval = "10s"
# Local file for persisting state changes and event logs
data_file = "events.jsonl"
# Maximum file size before rotation
max_data_size = "50MB"
# Delay before the first scan to allow services to start
startup_grace = "30s"

[alerts]
# Global cooldown to prevent alert spam for the same check
cooldown = "15m"
# Whether to send a notification when a critical/warning state returns to normal
notify_recovery = true

# Hardware checks
# These can be enabled directly without creating [[check]] entries

[cpu]
enabled = true
warning = 80
critical = 95

[memory]
enabled = true
warning = 80
critical = 95

[swap]
enabled = true
warning = 50
critical = 80

[disk]
enabled = true
path = "/"
warning = 80
critical = 90

[temperature]
enabled = true
warning = 75
critical = 85

# Notification channels
# Multiple channels can be defined

[[notify]]
type = "stdout"

#[[notify]]
#type = "telegram"
#token = "your-bot-token"
#chat_id = "your-chat-id"

#[[notify]]
#type = "discord"
